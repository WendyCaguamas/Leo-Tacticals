<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Carrito de compras de Leo Tacticals"
    >

    <link
        rel="icon"
        type="image/png"
        href="../img/favicon.png"
    >

    <title>Carrito — Leo Tacticals</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="catalogo.css"
    >

    <link
        rel="stylesheet"
        href="carrito.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <header>

        <div class="logo">

            <a href="../index.html">

                <img
                    src="../img/banner.png"
                    alt="Leo Tacticals"
                >

            </a>

        </div>


        <nav>

            <a href="../index.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    Inicio
                </span>

            </a>


            <a href="catalogo.html">

                <i class="fa-solid fa-box"></i>

                <span>
                    Catálogo
                </span>

            </a>


            <a href="carrito.html">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>
                    Carrito
                </span>

            </a>

        </nav>

    </header>


    <main>

        <section class="carrito-pagina">

            <div class="carrito-contenedor">

                <div class="carrito-titulo">

                    <h1>
                        CARRITO
                    </h1>

                    <p>
                        Revisa los productos que deseas comprar.
                    </p>

                </div>


                <div
                    class="carrito-lista"
                    id="carrito-lista"
                >

                </div>


                <div class="carrito-resumen">

                    <div class="carrito-total">

                        <span>
                            TOTAL
                        </span>

                        <strong id="carrito-total">
                            $0.00
                        </strong>

                    </div>


                    <!-- COSTO DE ENVÍO -->

                    <div class="carrito-envio">

                        <span>
                            <i class="fa-solid fa-truck"></i>
                            Envío
                        </span>

                        <strong id="carrito-envio">
                            $0.00
                        </strong>

                    </div>


                    <!-- MENSAJE DE ENVÍO GRATIS -->

                    <p
                        id="mensaje-envio"
                        class="mensaje-envio"
                    >
                        Agrega productos para conocer el costo de envío.
                    </p>


                    <button
                        class="boton-carrito"
                        id="boton-whatsapp"
                    >

                        <i class="fa-brands fa-whatsapp"></i>

                        Enviar pedido por WhatsApp

                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Leo Tacticals — Todos los derechos reservados.
        </p>

    </footer>


    <script src="../js/productos.js"></script>

    <script src="../js/carrito.js"></script>

</body>

</html>
